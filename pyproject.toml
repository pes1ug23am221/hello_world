[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxml-secdiff"
version = "0.1.0"
description = "Detect security regressions between two AUTOSAR ARXML snapshots"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "networkx>=3.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
arxml-secdiff = "arxml_secdiff.cli:main"

[tool.setuptools]
packages = ["arxml_secdiff"]